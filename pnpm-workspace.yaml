packages:
  - packages/*
  - examples/*

strictPeerDependencies: false
sideEffectsCache: false
linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@cyco130/eslint-config"

allowBuilds:
  esbuild: true
  unrs-resolver: true
permissions:
  tsdown:
    skills: true
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
